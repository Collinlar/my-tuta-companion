[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[[redirects]]
  from   = "/api/groq"
  to     = "/.netlify/functions/groq"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/paystack-verify"
  to     = "/.netlify/functions/paystack-verify"
  status = 200
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[context.production.environment]
  VITE_APP_RELEASE = "production"
